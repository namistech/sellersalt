name: CI

# Runs on every push to staging/main, and on pull requests targeting them —
# catches build failures (like the missing-Suspense-boundary incident)
# automatically, before Coolify ever attempts to deploy the result.
on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma@5.22.0 generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npx next build
        env:
          # Dummy values — this job only needs the build to *succeed*, not
          # to actually connect to a real database. GitHub's runners have
          # full internet access (unlike some sandboxes), so this is a
          # genuinely more decisive check than any local build check can be.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          REDIS_URL: "redis://localhost:6379"
          NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-for-anything-real"
          NEXTAUTH_URL: "https://staging.sellersalt.com"
          ENCRYPTION_KEY: "Y2ktcGxhY2Vob2xkZXItMzItYnl0ZXMtbm90LXJlYWwtMTIz"
          ADMIN_EMAILS: "ci@example.com"
